[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spikeclip"
version = "0.1.0"
description = "Free, local Twitch clipper: watch live chat, catch the spikes, cut vertical Shorts with captions."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "SpikeClip contributors"}]
keywords = ["twitch", "clipping", "shorts", "streamlink", "whisper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "streamlink==8.6.3",
    "faster-whisper==1.2.1",
    "websocket-client==1.9.2",
    "PyYAML==6.0.3",
    "av==12.3.0",
]

[project.scripts]
spikeclip = "spikeclip.cli:main"

[project.urls]
Homepage = "https://github.com/orakzisajidkhan-cmyk/spikeclip"

[tool.setuptools.packages.find]
include = ["spikeclip*"]
